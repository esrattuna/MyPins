<div class="app" id="app">
  <div class="map" id="map">
    <div id="mapgl" role="region" data-i18n-aria="mapLabel" aria-label="Harita"></div>
    <div class="brand"><h1 class="brand-t"><svg class="brand-logo" width="22" height="26" viewBox="0 0 22 26" aria-hidden="true"><path d="M11 25s9-8.6 9-14.5A9 9 0 0 0 2 10.5C2 16.4 11 25 11 25z" fill="#f4e08c" stroke="#23302F" stroke-width="1.8"/><circle cx="11" cy="10.5" r="3" fill="#23302F"/></svg><span id="brandName">MyPins</span></h1><p id="brandSub">Seyir notları · yerler · sofralar</p><button type="button" class="about-btn" id="aboutBtn" data-i18n="about" hidden>Hakkında</button></div>
    <div class="topbar"><div class="lang" role="group" aria-label="Dil / Language"><button type="button" data-lang="tr">TR</button><button type="button" data-lang="en">EN</button></div><button type="button" class="ask-top" id="askTop" aria-label="Planla" hidden><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v7a2.5 2.5 0 0 1-2.5 2.5H10l-4 3.5V16h.5A2.5 2.5 0 0 1 4 13.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 6.8l.9 2.4 2.4.9-2.4.9-.9 2.4-.9-2.4-2.4-.9 2.4-.9z" fill="#f4e08c"/></svg></button><div class="acct" id="acct"></div></div>
    <div class="controls" hidden>
      <button type="button" id="zin" hidden aria-hidden="true" tabindex="-1">+</button>
      <button type="button" id="zout" hidden aria-hidden="true" tabindex="-1">−</button>
      <button type="button" id="zhome" data-i18n-aria="zoomHome" aria-label="Tüm haritayı göster">⌂</button>
    </div>
    <div class="coord-readout" id="readout">—</div>
    <div class="pick-banner" id="pickBanner" hidden><span data-i18n="pickHint">Haritada notun yerine dokun</span><button type="button" id="pickCancel" data-i18n="cancel">Vazgeç</button></div>
  </div>
  <aside class="panel" id="panel" aria-label="Defter">
    <button class="handle" id="handle" type="button" data-i18n-aria="sheet" aria-label="Paneli büyüt veya küçült"><span></span></button>
    <div class="panel-scroll" id="panelBody"></div>
  </aside>
</div>
<div class="lightbox" id="lightbox" hidden>

  <button class="lb-btn lb-close" id="lbClose" type="button" data-i18n-aria="close" aria-label="Kapat">✕</button>
  <button class="lb-btn lb-prev" id="lbPrev" type="button" data-i18n-aria="prev" aria-label="Önceki">‹</button>
  <button class="lb-btn lb-next" id="lbNext" type="button" data-i18n-aria="next" aria-label="Sonraki">›</button>
</div>

  </div>
</div>
