: "ME", "lat": 42.4415, "lon": 19.2645, "date": "", "note": "Hayatımda yediğim en iyi muffinleri burada yedim. Özellikle narlı ve red velvet olanları mutlaka deneyin.", "note_en": "The best muffins I've ever had. You have to try the pomegranate and the red velvet ones.", "dish": "Narlı muffin, red velvet muffin", "dish_en": "Pomegranate muffin, red velvet muffin", "rating": 5, "price": "", "photos": []}, {"kind": "yemek", "home": null, "title": "Maison Luce Avenida – Coffee & Brunch", "title_en": null, "city": "Lizbon", "country": "Portekiz", "iso": "PT", "lat": 38.7195, "lon": -9.1455, "date": "", "note": "Yediğim en iyi bademli kruvasandı. Şekerli kahvaltıyı sevmeyen biri olmama rağmen Lizbon'daki her günümde burada bademli kruvasan yedim.\n\nAdres: Avenida da Liberdade, Lizbon", "note_en": "The best almond croissant I've ever had. I'm not someone who likes a sweet breakfast, but I had an almond croissant here every single day I was in Lisbon.\n\nAddress: Avenida da Liberdade, Lisbon", "dish": "Bademli kruvasan", "dish_en": "Almond croissant", "rating": 5, "price": "", "photos": ["57cc317f8132ecb500a9b6de19ad6d7f"]}, {"kind": "yer", "home": null, "title": "Milano", "title_en": null, "city": "Milano", "country": "İtalya", "iso": "IT", "lat": 45.4642, "lon": 9.19, "date": "", "note": "", "note_en": null, "dish": "", "dish_en": null, "rating": 0, "price": "", "photos": []}, {"kind": "yer", "home": null, "title": "Napoli", "title_en": null, "city": "Napoli", "country": "İtalya", "iso": "IT", "lat": 40.8518, "lon": 14.2681, "date": "", "note": "", "note_en": null, "dish": "", "dish_en": null, "rating": 0, "price": "", "photos": []}, {"kind": "yer", "home": null, "title": "Nazare", "title_en": null, "city": "Nazaré", "country": "Portekiz", "iso": "PT", "lat": 39.6012, "lon": -9.07, "date": "", "note": "", "note_en": null, "dish": "", "dish_en": null, "rating": 0, "price": "", "photos": ["a1453f7ab67ee721beb35b0db4d85268", "90d691bf244992e49f581eb80534565d"]}, {"kind": "  el Sheikh", "title_en": null, "city": "Sharm el Sheikh", "country": "Mısır", "iso": "EG", "lat": 27.9158, "lon": 34.3299, "date": "", "note": "", "note_en": null, "dish": "", "dish_en": null, "rating": 0, "price": "", "photos": []}, {"kind": "yer", "home": false, "title": "Eski Çarşı ve Al Sahaba Camii", "title_en": "Old Market & Al Sahaba Mosque", "city": "Sharm el Sheikh", "country": "Mısır", "iso": "EG", "lat": 27.8614, "lon": 34.2953, "date": "", "note": "", "note_en": "", "dish": "", "dish_en": "", "rating": 0, "price": "", "photos": ["309be11f5d532893e98490b9bb3e4125", "9754b8ab540b670dd833ae40a44a2c26", "63ed4cdcd025185e49e9204b022e02f9"]}, {"kind": "yer", "home": null, "title": "Sitges", "title_en": null, "city": "Sitges", "country": "İspanya", "iso": "ES", "lat": 41.2371, "lon": 1.8113, "date": "", "note": "", "note_en": null, "dish": "", "dish_en": null, "rating": 0, "price": "", "photos": []}, {"kind": "yemek", "home": null, "title": "Taberna Económica de Cascais", "title_en": null, "city": "Cascais", "country": "Portekiz", "iso": "PT", "lat": 38.6978, "lon": -9.4212, "date": "", "note": "Bacalhau à Brás'ı çok beğendim. Didiklenmiş tuzlu morina balığı, ince kibrit çöpü gibi doğranmış kızarmış patates, soğan ve yumurtayla yapılıyor. Üzerine maydanoz ve siyah zeytin konuyor.\n\nAdres: R. Sebastião José de Carvalho e Melo 35, Cascais", "note_en": "I loved the Bacalhau à Brás. It's made with shredded salt cod, matchstick-thin fried potatoes, onion and egg, topped with parsley and black olives.\n\nAddress: R. Sebastião José de Carvalho e Melo 35, Cascais", "dish": "Bacalhau à Brás", "dish_en": null, "rating": 5, "price": "", "photos": ["1b592eb81920741a6f9cccbdd9f3d3a1"]}, {"kind": "yer", "home": null, "title": "Tossa de Mar", "title_en": null, "city": "Tossa de Mar", "country": "İspanya", "iso": "ES", "lat": 41.7197, "lon": 2.9339, "date": "", "note": "", "note_en": null, "dish": "", "dish_en": null, "rating": 0, "price": "", "photos": []}];
const sb = supabase.createClient(MYPINS.supabaseUrl, MYPINS.supabaseKey, { auth: { persistSession: true, flowType: "pkce" } });
const $ = s => document.querySelector(s);
const log = (m, c) => { const l = $("#log"); l.hidden = false; const d = document.createElement("div"); if (c) d.className = c; d.textContent = m; l.append(d); l.scrollTop = l.scrollHeight; };
let me = null, files = new Map();
async function shrink(file) {
  const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
  const s = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
  if (s === 1 && file.size < 1.5e6) return file;
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error("encode")), "image/jpeg", 0.86));
}
const uid = () => crypto.randomUUID();
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $("#who").innerHTML = 'Önce <a href="./">MyPins</a>\'e Google ile giriş yap, sonra bu sayfayı yenile.'; return; }
  me = session.user;
  $("#who").textContent = "Giriş yapıldı: " + (me.email || me.id);
  $("#step").hidden = false;
})();
$("#files").onchange = e => {
  files = new Map([...e.target.files].map(f => [f.name.replace(/\.[^.]+$/, ""), f]));
  const need = SYNC.flatMap(p => p.photos || []);
  const have = need.filter(id => files.has(id)).length;
  log(`${have} / ${need.length} fotoğraf eşleşti.`, have === need.length ? "ok" : "bad");
  $("#go").disabled = have === 0;
};
$("#go").onclick = async () => {
  $("#go").disabled = true;
  const { data: mine, error } = await sb.from("pins").select("id,title,photos").eq("user_id", me.id);
  if (error) { log("Pinler okunamadı: " + error.message, "bad"); return; }
  const byTitle = new Map(mine.map(p => [p.title, p]));
  let up = 0, upd = 0, add = 0;
  for (const p of SYNC) {
    const paths = [];
    for (const id of p.photos || []) {
      const f = files.get(id); if (!f) continue;
      const path = `${me.id}/${uid()}.jpg`;
      const blob = await shrink(f);
      const { error: ue } = await sb.storage.from("photos").upload(path, blob, { contentType: "image/jpeg" });
      if (ue) { log(`Fotoğraf yüklenemedi (${p.title}): ${ue.message}`, "bad"); continue; }
      paths.push(path); up++;
    }
    const row = { kind: p.kind, home: !!p.home, title: p.title, title_en: p.title_en || "", city: p.city || "", country: p.country || "", iso: p.iso || "",
      lat: p.lat, lon: p.lon, visited_on: p.date || null, note: p.note || "", note_en: p.note_en || "", dish: p.dish || "", dish_en: p.dish_en || "",
      rating: p.rating || 0, price: p.price || "" };
    const cur = byTitle.get(p.title);
    if (cur) {
      row.photos = [...(cur.photos || []), ...paths];
      const { error: e2 } = await sb.from("pins").update(row).eq("id", cur.id);
      if (e2) log(`Güncellenemedi: ${p.title}: ${e2.message}`, "bad"); else { upd++; if (paths.length) log(`✓ ${p.title}: ${paths.length} fotoğraf`); }
    } else {
      row.photos = paths; row.user_id = me.id;
      const { error: e3 } = await sb.from("pins").insert(row);
      if (e3) log(`Eklenemedi: ${p.title}: ${e3.message}`, "bad"); else { add++; log(`＋ Yeni yer: ${p.title}`); }
    }
  }
  log(`Bitti: ${up} fotoğraf yüklendi, ${upd} yer güncellendi, ${add} yeni yer eklendi.`, "ok");
  log("Şimdi MyPins'i açıp kontrol edebilirsin.");
};
